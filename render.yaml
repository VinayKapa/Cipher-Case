services:
  - type: web
    name: ciphercase-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace @ciphercase/shared && npm run build --workspace @ciphercase/api
    startCommand: npm run start --workspace @ciphercase/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: MONGODB_URI
        sync: false
      - key: CASE_TTL_DAYS
        value: "14"
